[package]
name = "lithia_native_router"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
lithia_native_scanner = { path = "../native-scanner" }
napi = { version = "3.8.2", features = ["napi9"] }
napi-derive = { version = "3.5.1" }
regex = { version = "1.12.2" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.24.0"
